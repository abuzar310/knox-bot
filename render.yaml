# Knox — Render Blueprint (singapore)
# Avoid corepack (broken signatures on some Node builds) — install pnpm via npm.

previews:
  generation: off

services:
  - type: web
    name: knox-bot
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install -g pnpm@10.15.0 && pnpm install --frozen-lockfile && pnpm --filter @knox/shared build && pnpm --filter @knox/config build && pnpm --filter @knox/db build && pnpm --filter @knox/bot build
    startCommand: pnpm --filter @knox/bot start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false

  - type: web
    name: knox-web
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install -g pnpm@10.15.0 && pnpm install --frozen-lockfile && pnpm --filter @knox/shared build && pnpm --filter @knox/config build && pnpm --filter @knox/db build && pnpm --filter @knox/web build
    startCommand: pnpm --filter @knox/db migrate && pnpm --filter @knox/web exec next start --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
