# Knox — Render Blueprint (singapore = lowest latency for IN/SEA)
# Native Node (not Docker) so free tier can actually build.

previews:
  generation: off

databases:
  - name: knox-db
    region: singapore
    plan: free
    postgresMajorVersion: "16"
    databaseName: knox
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow-all-initial

services:
  - type: web
    name: knox-bot
    runtime: node
    region: singapore
    plan: free
    rootDir: .
    buildCommand: corepack enable && corepack prepare pnpm@10.15.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @knox/shared build && pnpm --filter @knox/config build && pnpm --filter @knox/db build && pnpm --filter @knox/bot build
    startCommand: pnpm --filter @knox/bot start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: knox-db
          property: connectionString
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false

  - type: web
    name: knox-web
    runtime: node
    region: singapore
    plan: free
    rootDir: .
    buildCommand: corepack enable && corepack prepare pnpm@10.15.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @knox/shared build && pnpm --filter @knox/config build && pnpm --filter @knox/db build && pnpm --filter @knox/web build
    startCommand: pnpm --filter @knox/db migrate && pnpm --filter @knox/web exec next start --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=460
      - key: DATABASE_URL
        fromDatabase:
          name: knox-db
          property: connectionString
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
